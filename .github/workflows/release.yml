name: Release

# Push a tag like v0.4.0 or v0.4.0-beta.1 to build the debug APK and attach it to a
# GitHub release. Tags with a "-" suffix are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "phone-whisper-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: phone-whisper-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
